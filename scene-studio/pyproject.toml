[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-studio"
version = "0.1.0"
description = "Turn one image into video, three ways (animate / travel / chain), from one CLI."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.scripts]
scene-studio = "scene_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["scene_studio*"]
